<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage Dossier — Locked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B2740;--abyss:#071B2E;--panel:#0F3050;--brass:#C9A85C;--brass-soft:#E4CD97;
        --foam:#E9F0F3;--foam-dim:#A9C0CE;--line:rgba(201,168,92,.22);--coral:#E58A63}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1000px 560px at 70% -10%,#123a5e 0%,rgba(18,58,94,0) 60%),
               radial-gradient(800px 460px at 0% 100%,#0a2033 0%,rgba(10,32,51,0) 55%),var(--ink);
    color:var(--foam);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .lock{width:100%;max-width:420px;background:linear-gradient(180deg,var(--panel),var(--abyss));
    border:1px solid var(--line);border-radius:16px;padding:34px 30px;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.75);text-align:center}
  .ico{font-size:1.9rem;color:var(--brass)}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-top:14px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.7rem;margin:.35em 0 .2em;line-height:1.15}
  p.sub{color:var(--foam-dim);font-size:.9rem;margin:0 0 22px}
  input{width:100%;background:var(--abyss);border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;color:var(--foam);font-family:inherit;font-size:1rem;text-align:center;letter-spacing:.02em}
  input:focus{outline:2px solid var(--brass-soft);outline-offset:2px}
  button{width:100%;margin-top:11px;border:1px solid var(--brass);background:var(--brass);color:var(--abyss);
    border-radius:10px;padding:13px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s}
  button:hover{background:var(--brass-soft);border-color:var(--brass-soft)}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--coral);font-size:.85rem;margin-top:13px;min-height:1.2em}
  .hint{color:var(--foam-dim);font-size:.75rem;margin-top:20px;line-height:1.6;opacity:.85}
</style>
</head>
<body>
  <div class="lock">
    <div class="ico">&#9875;</div>
    <div class="eyebrow">M&aacute;laga &rarr; Miami</div>
    <h1>Voyage Dossier</h1>
    <p class="sub">This itinerary contains live tickets. Enter the passphrase to unlock.</p>
    <input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password" autofocus>
    <button id="go">Unlock</button>
    <div class="err" id="err"></div>
    <div class="hint">Contents are encrypted with AES-256. Nothing readable exists in this file without the passphrase.</div>
  </div>
